function Dialog({title,children,ok,okLabel='OK',cancelLabel='Cancel',danger,onClose}){
 const [out,setOut]=useState(false);
 const done=f=>{setOut(true);setTimeout(f,110)};
 useEffect(()=>{const k=e=>{if(e.key==='Escape')done(onClose);else if(e.key==='Enter'&&ok&&!/^(INPUT|BUTTON|A)$/.test(e.target.tagName))done(ok)};addEventListener('keydown',k);return()=>removeEventListener('keydown',k)});
 return html`<div className=${'ov'+(out?' out':'')} onMouseDown=${e=>e.target===e.currentTarget&&done(onClose)}>
  <div className="dlg" role="dialog" aria-modal="true" aria-label=${title}>
   <div className="p-6"><h2 className="text-xl font-semibold mb-4" style=${{lineHeight:'28px'}}>${title}</h2>${children}</div>
   <div className="dfoot">${ok&&html`<button className=${'btn '+(danger?'crit':'acc')} onClick=${()=>done(ok)}>${okLabel}</button>`}<button className="btn" onClick=${()=>done(onClose)}>${cancelLabel}</button></div>
  </div></div>`}

function Rename({s,onSave,onClose}){
 const [v,setV]=useState(s.title);
 return html`<${Dialog} title="Rename this chat" ok=${()=>onSave(v)} okLabel="Rename" onClose=${onClose}>
  <input autoFocus className="tb w-full" value=${v} onChange=${e=>setV(e.target.value)} onFocus=${e=>e.target.select()} onKeyDown=${e=>e.key==='Enter'&&onSave(v)}/><//>`}

function Menu({m,onRename,onDelete,onClose}){
 useEffect(()=>{const k=e=>e.key==='Escape'&&onClose();addEventListener('click',onClose);addEventListener('keydown',k);addEventListener('resize',onClose);return()=>{removeEventListener('click',onClose);removeEventListener('keydown',k);removeEventListener('resize',onClose)}},[]);
 return html`<div className="flyout" style=${{left:Math.min(m.x,innerWidth-176),top:Math.min(m.y,innerHeight-96)}} onContextMenu=${e=>e.preventDefault()}>
  <button className="mi" onClick=${onRename}><${I} n="edit"/>Rename</button>
  <button className="mi crit-t" onClick=${onDelete}><${I} n="trash"/>Delete</button></div>`}

function Msg({m,k,sp,onSpeak,d}){
 const [c,setC]=useState(false);
 const copy=()=>{try{navigator.clipboard.writeText(m.text).then(()=>{setC(true);setTimeout(()=>setC(false),1800)}).catch(()=>{})}catch(e){}};
 if(m.role==='user')return html`<div className="msg user" style=${{animationDelay:d+'ms'}}>${m.text}</div>`;
 const on=sp===k;
 return html`<div className=${'msg bot'+(m.error?' err':'')} style=${{animationDelay:d+'ms'}}>
  <div className="whitespace-pre-wrap break-words">${m.text}</div>
  <div className="flex flex-wrap items-center gap-2 mt-3">
   <span className="tag">${m.source}</span>
   <button className="btn sub sm" onClick=${copy}><${I} key=${c?'c':'n'} c=${c?'pop':''} n=${c?'check':'copy'} s=${14}/>${c?'Copied!':'Copy'}</button>
   <button className=${'btn sub sm'+(on?' on':'')} onClick=${()=>onSpeak(k,m.text)}><${I} n=${on?'stop':'spk'} s=${14}/>${on?'Stop':'Hear'}</button>
   <button className="btn sub sm" onClick=${()=>m.prompt&&window.open('https://google.com/search?q='+encodeURIComponent(m.prompt),'_blank','noopener')}><${I} n="search" s=${14}/>Verify</button>
  </div></div>`}

function App(){

 const del=id=>{const r=S.filter(s=>s.id!==id);if(!r.length){const n=mk();setS([n]);setCur(n.id)}else{setS(r);if(cur===id)setCur(r[r.length-1].id)}};
 const closeIb=()=>{setIb('out');setTimeout(()=>setIb('gone'),260)};
 async function send(){
  const q=text.trim();if(!q)return;const sid=cur;setText('');setSn(n=>n+1);
  setS(a=>a.map(s=>s.id===sid?{...s,title:s.title==='New Chat'?(q.length>22?q.substring(0,22)+'...':q):s.title,msgs:[...s.msgs,{role:'user',text:q}]}:s));
  setPend(p=>({...p,[sid]:(p[sid]||0)+1}));
  let m;
  try{const r=await fetch(API+'?q='+encodeURIComponent(q),{method:'GET',redirect:'follow'});const d=await r.json();
   m={role:'bot',text:String(d.answer),source:'Source: '+String(d.source||'unknown').replace(/_/g,' '),prompt:q}}
  catch(e){console.error(e);m={role:'bot',text:'Critical connection error.',source:'Network Failure',prompt:q,error:true}}
  setPend(p=>({...p,[sid]:Math.max(0,(p[sid]||1)-1)}));add(sid,m)}
 const ti=THEMES.findIndex(t=>t[0]===theme);

       onKeyDown=${e=>e.key==='Enter'&&pick(s.id)} onContextMenu=${e=>{e.preventDefault();setMenu({x:e.clientX,y:e.clientY,id:s.id})}}>
       <${I} n="chat"/><span className="lbl truncate flex-1">${s.title}</span>

    </div>
    <button className="nav cbtn" title=${'Theme: '+THEMES[ti][1]} onClick=${()=>setTheme(THEMES[(ti+1)%3][0])}><${I} n=${THEMES[ti][2]}/></button>
    <div className="p-3 border-t border-stroke pn">

      ${THEMES.map(t=>html`<button key=${t[0]} role="radio" aria-checked=${theme===t[0]} className=${theme===t[0]?'on':''} onClick=${()=>setTheme(t[0])}><${I} n=${t[2]} s=${14}/>${t[1]}</button>`)}</div>
    </div>
   </div></aside>
   <main className="flex-1 min-w-0 flex flex-col bg-layer border-t border-l border-stroke rounded-tl-card overflow-hidden">

     <span className="w-4 h-4 rounded-full bg-accent flex-none grid place-items-center text-[11px] font-bold" style=${{color:'var(--onacc)'}}>i</span>

    </div></div></div></div>`}

  ${menu&&html`<${Menu} m=${menu} onClose=${()=>setMenu(null)} onRename=${()=>{setDlg({t:'rename',id:menu.id});setMenu(null)}} onDelete=${()=>{setDlg({t:'del',id:menu.id});setMenu(null)}}/>`}
